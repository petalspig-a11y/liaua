<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>liaua</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Noto Serif SC -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Cropper.js CSS & JS CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cream: '#FAFAFA',         /* 乳白色主背景 */
                        stoneLight: '#F5F5F5',    /* 浅灰底色 */
                        borderSubtle: '#E5E5E5',  /* 细微边框 */
                        textMain: '#111111',      /* 纯黑主文字 */
                        textMuted: '#555555',     /* 灰黑辅助字 */
                        accent: '#222222'         /* 重点强调色 */
                    },
                    fontFamily: {
                        sans: ['"Times New Roman"', 'Times', 'serif'],
                        serif: ['"Times New Roman"', 'Noto Serif SC', 'serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #FAFAFA;
            color: #111111;
            font-family: 'Times New Roman', 'Noto Serif SC', serif;
            padding-bottom: env(safe-area-inset-bottom);
        }
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #FAFAFA;
        }
        ::-webkit-scrollbar-thumb {
            background: #CCCCCC;
            border-radius: 2px;
        }
        .editorial-shadow {
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.08);
        }
        .drag-over {
            background-color: #F0F0F0;
            border: 1px dashed #111111;
        }
        @supports (-webkit-touch-callout: none) {
            input, select, textarea {
                font-size: 16px !important;
            }
        }
        .filter-scroll {
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .filter-scroll::-webkit-scrollbar {
            display: none;
        }
        @media (max-width: 640px) {
            .modal-content-mobile {
                max-height: 92vh;
                border-radius: 16px 16px 0 0;
                padding-bottom: calc(2rem + env(safe-area-inset-bottom));
            }
        }
        .resolve-editable {
            transition: border-color 0.2s, background-color 0.2s;
            border-bottom: 1px dashed transparent;
        }
        .resolve-editable:hover,
        .resolve-editable:focus {
            border-bottom-color: #111111;
            outline: none;
        }
        .resolve-toast {
            position: fixed;
            left: 50%;
            bottom: calc(2rem + env(safe-area-inset-bottom));
            transform: translateX(-50%) translateY(20px);
            background: #111111;
            color: #FAFAFA;
            font-size: 11px;
            letter-spacing: 0.1em;
            padding: 8px 16px;
            border-radius: 2px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            z-index: 100;
        }
        .resolve-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-[#E5E5E5]">

    <!-- 顶部导航 -->
    <header class="w-full pt-10 md:pt-12 pb-6 px-6 md:px-20 flex justify-end items-center gap-6 md:gap-8 text-sm text-textMuted font-light"
            style="padding-top: calc(2.5rem + env(safe-area-inset-top));">
        <span id="recordCount" class="tracking-wider">收录：0</span>
        <button onclick="handleAddClick()"
                aria-label="新增"
                title="新增记录"
                class="w-9 h-9 md:w-8 md:h-8 flex items-center justify-center rounded-full text-textMain hover:opacity-60 active:opacity-40 transition-all text-2xl md:text-xl font-extralight leading-none select-none">
            ＋
        </button>
    </header>

    <!-- 主体内容区 -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-6 md:px-20 py-4 md:py-8">

        <!-- ============ 主页一级分类 ============ -->
        <div class="flex items-center gap-8 mb-8 pb-4 text-xs uppercase tracking-widest overflow-x-auto filter-scroll whitespace-nowrap border-b border-borderSubtle">
            <button onclick="filterTag('all')" id="tag-all" class="tag-btn text-textMain font-medium pb-1 border-b border-textMain transition-all shrink-0">ALL</button>
            <button onclick="filterTag('色彩')" id="tag-色彩" class="tag-btn text-textMuted hover:text-textMain pb-1 border-b border-transparent transition-all shrink-0">色彩</button>
            <button onclick="filterTag('材质')" id="tag-材质" class="tag-btn text-textMuted hover:text-textMain pb-1 border-b border-transparent transition-all shrink-0">材质</button>
            <button onclick="filterTag('书籍')" id="tag-书籍" class="tag-btn text-textMuted hover:text-textMain pb-1 border-b border-transparent transition-all shrink-0">书籍</button>
            <button onclick="filterTag('网页')" id="tag-网页" class="tag-btn text-textMuted hover:text-textMain pb-1 border-b border-transparent transition-all shrink-0">网页</button>
            <button onclick="filterTag('好物')" id="tag-好物" class="tag-btn text-textMuted hover:text-textMain pb-1 border-b border-transparent transition-all shrink-0">好物</button>
            <button onclick="filterTag('定力')" id="tag-定力" class="tag-btn text-textMuted hover:text-textMain pb-1 border-b border-transparent transition-all shrink-0 font-medium tracking-widest">定力</button>
        </div>

        <!-- ============ 定力分类下的子栏目 ============ -->
        <div id="resolveSubNav" class="hidden flex items-center justify-between mb-8 pb-3 text-xs tracking-wider border-b border-borderSubtle/60">
            <div class="flex items-center gap-6">
                <button onclick="switchResolveSub('train')" id="resolve-sub-train" class="resolve-sub-btn text-textMain font-medium pb-1 border-b border-textMain transition-all">训练的事</button>
                <button onclick="switchResolveSub('quote')" id="resolve-sub-quote" class="resolve-sub-btn text-textMuted hover:text-textMain pb-1 border-b border-transparent transition-all">句子</button>
            </div>
            <!-- OneLine 外部链接 -->
            <a href="https://petalspig-a11y.github.io/OneLine/"
               target="_blank"
               rel="noopener noreferrer"
               class="inline-flex items-center gap-1.5 text-textMuted hover:text-textMain tracking-wider transition-all">
                <span>OneLine 链接</span>
                <span class="text-[10px]">&nearr;</span>
            </a>
        </div>

        <!-- 定力：标语/自我提醒 -->
        <section id="resolvePanel" class="hidden mb-10 border-b border-borderSubtle pb-6">
            <div class="flex items-center justify-between mb-3">
                <span class="text-[10px] uppercase tracking-[0.3em] text-textMuted font-light">核心定力 · Target</span>
                <span class="text-[10px] text-textMuted/60 font-light tracking-wider">点按可编辑</span>
            </div>
            <p id="resolveMotto"
               class="resolve-editable font-serif text-sm md:text-base font-light leading-relaxed text-textMain cursor-text tracking-wide"
               contenteditable="true"
               spellcheck="false"></p>
        </section>

        <!-- 动态卡片列表区 -->
        <div id="archiveGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-x-6 gap-y-10 md:gap-x-12 md:gap-y-16">
            <!-- 动态生成卡片 -->
        </div>

        <!-- 空状态提示 -->
        <div id="emptyState" class="hidden flex flex-col items-center justify-center py-24 md:py-32 text-center px-6">
            <p id="emptyText" class="font-serif text-sm md:text-base text-textMuted mb-4 italic font-light tracking-wide leading-relaxed">“暂无灵感收录，开启你的美学建构吧。”</p>
            <button id="emptyBtn" onclick="handleAddClick()" class="text-xs uppercase tracking-widest pb-1 border-b border-textMain text-textMain hover:opacity-60">添加记录</button>
        </div>
    </main>

    <!-- 底部预留图标区域 -->
    <footer class="w-full py-12 px-6 flex flex-col items-center justify-center mt-auto">
        <img src="bottom.png" alt="Footer Icon" class="w-10 h-10 object-contain opacity-50 hover:opacity-100 transition-opacity duration-300" onerror="this.style.display='none'">
    </footer>

    <!-- 模态框 1：新增/编辑 美学灵感切片 -->
    <div id="uploadModal" class="fixed inset-0 bg-textMain/20 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-cream max-w-xl w-full p-6 md:p-12 editorial-shadow relative max-h-[95vh] overflow-y-auto modal-content-mobile border border-borderSubtle">
            <button onclick="closeModal()" class="absolute top-6 right-6 md:top-8 md:right-8 text-textMuted hover:text-textMain text-xs uppercase tracking-wider">关闭 &times;</button>

            <h2 id="modalTitle" class="font-serif text-xl md:text-2xl font-light mb-2 pr-10">捕捉灵感切片</h2>
            <p class="text-xs text-textMuted mb-8 md:mb-10 tracking-wider font-light">上传视觉参考，记录书页、网页瞬间或直觉碎碎念。</p>

            <form id="archiveForm" onsubmit="saveArchive(event)" class="space-y-6 md:space-y-8">
                <input type="hidden" id="editingId" value="">
                <div>
                    <label class="block text-xs uppercase tracking-wider text-textMuted mb-3 font-light">视觉参考图片 *</label>
                    
                    <!-- 图片未选择时的拖拽区 -->
                    <div id="dropZone" class="p-8 md:p-10 text-center cursor-pointer hover:bg-stoneLight transition-all bg-stoneLight/50 border border-borderSubtle"
                         onclick="document.getElementById('imageInput').click()"
                         ondragover="handleDragOver(event)"
                         ondragleave="handleDragLeave(event)"
                         ondrop="handleDrop(event)">
                        <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="previewImage(event)">
                        <div id="uploadPrompt" class="space-y-2">
                            <p class="text-sm text-textMain font-light">点击或拖拽图片至此处</p>
                            <p class="text-[10px] text-textMuted uppercase tracking-wider">支持 JPG, PNG, WEBP</p>
                        </div>
                    </div>

                    <!-- 图片裁剪与预览交互区 -->
                    <div id="cropContainer" class="hidden mt-3 space-y-3">
                        <div class="max-h-72 w-full bg-stoneLight overflow-hidden border border-borderSubtle flex items-center justify-center">
                            <img id="imageToCrop" class="max-w-full block" alt="Crop Target">
                        </div>
                        <div class="flex justify-between items-center text-xs">
                            <button type="button" onclick="applyCrop()" id="cropBtn" class="bg-textMain text-cream px-4 py-1.5 tracking-wider hover:opacity-80 transition-all">确认裁剪</button>
                            <button type="button" onclick="reselectImage()" class="text-textMuted hover:text-textMain underline tracking-wider">重新选择图片</button>
                        </div>
                    </div>

                    <!-- 最终渲染的图片预览 -->
                    <div id="croppedResultContainer" class="hidden mt-3 text-center border border-borderSubtle p-2 relative bg-stoneLight/30">
                        <img id="imagePreview" class="max-h-48 mx-auto object-contain" alt="Final Preview">
                        <button type="button" onclick="reselectImage()" class="mt-2 text-[11px] text-textMuted hover:text-textMain underline block w-full text-center">重新裁剪或更换图片</button>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs uppercase tracking-wider text-textMuted mb-2 font-light">切片标题 / 主题 *</label>
                        <input type="text" id="itemTitle" required class="w-full bg-transparent border-b border-borderSubtle py-2 text-sm focus:outline-none focus:border-textMain transition-all">
                    </div>
                    <div>
                        <label class="block text-xs uppercase tracking-wider text-textMuted mb-2 font-light">核心分类</label>
                        <select id="itemTag" class="w-full bg-transparent border-b border-borderSubtle py-2 text-sm focus:outline-none focus:border-textMain transition-all">
                            <option value="色彩">色彩 (Color)</option>
                            <option value="材质">材质 (Material)</option>
                            <option value="书籍">书籍 (Books)</option>
                            <option value="网页">网页 (Web)</option>
                            <option value="好物">好物 (Objects)</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs uppercase tracking-wider text-textMuted mb-2 font-light">相关网页链接 (URL)</label>
                    <input type="url" id="itemLink" class="w-full bg-transparent border-b border-borderSubtle py-2 text-sm focus:outline-none focus:border-textMain transition-all">
                </div>

                <div>
                    <label class="block text-xs uppercase tracking-wider text-textMuted mb-3 font-light">灵感语音备忘录 (Voice Memo)</label>
                    <div class="flex items-center gap-4 bg-stoneLight/60 p-4 border border-borderSubtle">
                        <button type="button" id="recordBtn" onclick="toggleRecording()" class="w-10 h-10 rounded-full border border-textMain flex items-center justify-center hover:bg-textMain hover:text-cream transition-all shrink-0">
                            <span id="recordIcon" class="w-2.5 h-2.5 bg-red-600 rounded-full"></span>
                        </button>
                        <div class="flex-1 min-w-0">
                            <div class="flex justify-between items-center mb-1">
                                <p id="recordStatus" class="text-xs text-textMuted font-light">点击左侧按钮开始录音</p>
                                <span id="recordTimer" class="text-[10px] font-mono text-textMuted hidden">00:00</span>
                            </div>
                            <audio id="audioPlayback" controls class="hidden w-full h-8 mt-1"></audio>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-xs uppercase tracking-wider text-textMuted mb-2 font-light">美学解构 / 为什么喜欢？</label>
                    <textarea id="itemDesc" rows="3" class="w-full bg-transparent border-b border-borderSubtle py-3 text-sm focus:outline-none focus:border-textMain transition-all resize-none"></textarea>
                </div>

                <div class="pt-4 md:pt-6 flex justify-end gap-6">
                    <button type="button" onclick="closeModal()" class="text-xs uppercase tracking-widest text-textMuted px-4 py-3 hover:text-textMain font-light">取消</button>
                    <button type="submit" class="bg-textMain text-cream text-xs uppercase tracking-widest px-8 py-3 hover:opacity-80 transition-all">沉淀切片</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 模态框 2：新增/编辑 定力记录 -->
    <div id="resolveModal" class="fixed inset-0 bg-textMain/20 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-cream max-w-lg w-full p-6 md:p-12 editorial-shadow relative max-h-[95vh] overflow-y-auto modal-content-mobile border border-borderSubtle">
            <button onclick="closeResolveModal()" class="absolute top-6 right-6 md:top-8 md:right-8 text-textMuted hover:text-textMain text-xs uppercase tracking-wider">关闭 &times;</button>

            <h2 id="resolveModalTitle" class="font-serif text-xl md:text-2xl font-light mb-2 pr-10">新增训练的事</h2>
            <p id="resolveModalDesc" class="text-xs text-textMuted mb-8 tracking-wider font-light">记录你想训练的具体事情或习惯方向。</p>

            <form id="resolveForm" onsubmit="saveResolveItem(event)" class="space-y-6">
                <input type="hidden" id="editingResolveId" value="">
                <div>
                    <label id="resolveLabel1" class="block text-xs uppercase tracking-wider text-textMuted mb-2 font-light">想训练的事 *</label>
                    <input type="text" id="resolveTitle" required class="w-full bg-transparent border-b border-borderSubtle py-2 text-sm focus:outline-none focus:border-textMain transition-all">
                </div>
                <div>
                    <label id="resolveLabel2" class="block text-xs uppercase tracking-wider text-textMuted mb-2 font-light">补充说明 / 目标细则</label>
                    <textarea id="resolveContent" rows="4" class="w-full bg-transparent border-b border-borderSubtle py-2 text-sm focus:outline-none focus:border-textMain transition-all resize-none font-serif"></textarea>
                </div>
                <div class="pt-4 flex justify-end gap-6">
                    <button type="button" onclick="closeResolveModal()" class="text-xs uppercase tracking-widest text-textMuted px-4 py-3 hover:text-textMain font-light">取消</button>
                    <button type="submit" class="bg-textMain text-cream text-xs uppercase tracking-widest px-8 py-3 hover:opacity-80 transition-all">保存记录</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 轻提示元素 -->
    <div id="resolveToast" class="resolve-toast"></div>

    <script>
        const DB_NAME = "AestheticArchiveDB";
        const STORE_NAME = "archives";
        const RESOLVE_STORE = "resolve";
        const RESOLVE_RECORDS_STORE = "resolve_records";

        let db = null;
        let currentImageBase64 = "";
        let audioBlob = null;
        let audioBase64 = null;
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;
        let recordStartTime = 0;
        let recordTimerInterval = null;
        
        let cropper = null;

        let currentFilter = 'all'; 
        let currentResolveSub = 'train'; // 'train' 或 'quote'

        let toastTimer = null;
        function showToast(msg) {
            const toast = document.getElementById('resolveToast');
            toast.innerText = msg;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
        }

        function initDB() {
            const request = indexedDB.open(DB_NAME, 3);
            request.onerror = (event) => console.error("IndexedDB error:", event.target.error);
            request.onsuccess = (event) => {
                db = event.target.result;
                loadContent();
                loadResolve();
            };
            request.onupgradeneeded = (event) => {
                const database = event.target.result;
                if (!database.objectStoreNames.contains(STORE_NAME)) {
                    database.createObjectStore(STORE_NAME, { keyPath: "id", autoIncrement: true });
                }
                if (!database.objectStoreNames.contains(RESOLVE_STORE)) {
                    database.createObjectStore(RESOLVE_STORE, { keyPath: "key" });
                }
                if (!database.objectStoreNames.contains(RESOLVE_RECORDS_STORE)) {
                    database.createObjectStore(RESOLVE_RECORDS_STORE, { keyPath: "id", autoIncrement: true });
                }
            };
        }

        function loadResolve() {
            if (!db) return;
            const tx = db.transaction([RESOLVE_STORE], "readonly");
            const store = tx.objectStore(RESOLVE_STORE);
            const mottoReq = store.get("motto");
            mottoReq.onsuccess = () => {
                const val = mottoReq.result ? mottoReq.result.value : "";
                const el = document.getElementById('resolveMotto');
                el.innerText = val;
                el.classList.toggle('text-textMuted/60', !val);
            };
        }

        function saveResolveField(key, value) {
            if (!db) return;
            const tx = db.transaction([RESOLVE_STORE], "readwrite");
            const store = tx.objectStore(RESOLVE_STORE);
            store.put({ key, value });
        }

        function bindResolveEditable() {
            const mottoEl = document.getElementById('resolveMotto');
            mottoEl.addEventListener('blur', () => {
                const text = mottoEl.innerText.trim();
                saveResolveField('motto', text);
                mottoEl.classList.toggle('text-textMuted/60', !text);
                showToast("已保存");
            });
            mottoEl.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    mottoEl.blur();
                }
            });
        }

        function handleAddClick() {
            if (currentFilter === '定力') {
                openResolveModal();
            } else {
                openModal();
            }
        }

        function openModal(editData = null) {
            document.getElementById('uploadModal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';

            if (editData) {
                document.getElementById('modalTitle').innerText = "编辑灵感切片";
                document.getElementById('editingId').value = editData.id;
                document.getElementById('itemTitle').value = editData.title || "";
                document.getElementById('itemTag').value = editData.tag || "色彩";
                document.getElementById('itemLink').value = editData.link || "";
                document.getElementById('itemDesc').value = editData.desc || "";

                if (editData.image) {
                    currentImageBase64 = editData.image;
                    document.getElementById('imagePreview').src = editData.image;
                    document.getElementById('croppedResultContainer').classList.remove('hidden');
                    document.getElementById('dropZone').classList.add('hidden');
                }

                if (editData.audio) {
                    audioBase64 = editData.audio;
                    const playback = document.getElementById('audioPlayback');
                    playback.src = editData.audio;
                    playback.classList.remove('hidden');
                    document.getElementById('recordStatus').innerText = "包含已有录音备忘";
                }
            } else {
                document.getElementById('modalTitle').innerText = "捕捉灵感切片";
                document.getElementById('editingId').value = "";
            }
        }

        function closeModal() {
            document.getElementById('uploadModal').classList.add('hidden');
            document.body.style.overflow = 'auto';
            document.getElementById('archiveForm').reset();
            document.getElementById('editingId').value = "";
            
            destroyCropper();
            document.getElementById('cropContainer').classList.add('hidden');
            document.getElementById('croppedResultContainer').classList.add('hidden');
            document.getElementById('dropZone').classList.remove('hidden');
            document.getElementById('uploadPrompt').classList.remove('hidden');

            currentImageBase64 = "";
            audioBlob = null;
            audioBase64 = null;
            document.getElementById('audioPlayback').classList.add('hidden');
            document.getElementById('audioPlayback').src = "";
            document.getElementById('recordStatus').innerText = "点击左侧按钮开始录音";
            document.getElementById('recordTimer').classList.add('hidden');
            document.getElementById('dropZone').classList.remove('drag-over');
        }

        function openResolveModal(editData = null) {
            const titleEl = document.getElementById('resolveModalTitle');
            const descEl = document.getElementById('resolveModalDesc');
            const label1 = document.getElementById('resolveLabel1');
            const label2 = document.getElementById('resolveLabel2');
            const titleInput = document.getElementById('resolveTitle');
            const contentInput = document.getElementById('resolveContent');

            if (currentResolveSub === 'train') {
                titleEl.innerText = editData ? '编辑训练的事' : '新增训练的事';
                descEl.innerText = '纯粹记录你想专注或训练的事情，不设打卡负担。';
                label1.innerText = '想训练的事 *';
                label2.innerText = '注意事项 / 细节拆解';
            } else {
                titleEl.innerText = editData ? '编辑句子' : '添加句子';
                descEl.innerText = '记录触动你的诗句、书摘或直觉碎碎念。';
                label1.innerText = '句子 / 摘录 *';
                label2.innerText = '出处 / 美学感悟';
            }

            if (editData) {
                document.getElementById('editingResolveId').value = editData.id;
                titleInput.value = editData.title || "";
                contentInput.value = editData.content || "";
            } else {
                document.getElementById('editingResolveId').value = "";
            }

            document.getElementById('resolveModal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeResolveModal() {
            document.getElementById('resolveModal').classList.add('hidden');
            document.body.style.overflow = 'auto';
            document.getElementById('resolveForm').reset();
            document.getElementById('editingResolveId').value = "";
        }

        function saveResolveItem(event) {
            event.preventDefault();
            const title = document.getElementById('resolveTitle').value.trim();
            const content = document.getElementById('resolveContent').value.trim();
            const editId = document.getElementById('editingResolveId').value;
            if (!title) return;

            const tx = db.transaction([RESOLVE_RECORDS_STORE], "readwrite");
            const store = tx.objectStore(RESOLVE_RECORDS_STORE);

            if (editId) {
                const req = store.get(Number(editId));
                req.onsuccess = () => {
                    const data = req.result;
                    data.title = title;
                    data.content = content;
                    store.put(data).onsuccess = () => {
                        closeResolveModal();
                        loadResolveRecords();
                    };
                }
            } else {
                const record = {
                    subType: currentResolveSub,
                    title,
                    content,
                    createdAt: new Date().toLocaleDateString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit' })
                };
                store.add(record).onsuccess = () => {
                    closeResolveModal();
                    loadResolveRecords();
                };
            }
        }

        /* ================= 图像处理与裁剪逻辑 ================= */
        function previewImage(event) {
            const file = event.target.files[0];
            if (file) handleImageFile(file);
        }

        function handleDragOver(event) { event.preventDefault(); event.stopPropagation(); document.getElementById('dropZone').classList.add('drag-over'); }
        function handleDragLeave(event) { event.preventDefault(); event.stopPropagation(); document.getElementById('dropZone').classList.remove('drag-over'); }
        function handleDrop(event) {
            event.preventDefault();
            event.stopPropagation();
            document.getElementById('dropZone').classList.remove('drag-over');
            const file = event.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                handleImageFile(file);
            }
        }

        function handleImageFile(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const imgToCrop = document.getElementById('imageToCrop');
                imgToCrop.src = e.target.result;
                document.getElementById('dropZone').classList.add('hidden');
                document.getElementById('croppedResultContainer').classList.add('hidden');
                document.getElementById('cropContainer').classList.remove('hidden');

                destroyCropper();
                cropper = new Cropper(imgToCrop, {
                    viewMode: 1,
                    autoCropArea: 0.9,
                    responsive: true,
                    background: false
                });
            };
            reader.readAsDataURL(file);
        }

        function applyCrop() {
            if (!cropper) return;
            const canvas = cropper.getCroppedCanvas({
                maxWidth: 1600,
                maxHeight: 1600
            });
            currentImageBase64 = canvas.toDataURL('image/jpeg', 0.88);
            document.getElementById('imagePreview').src = currentImageBase64;
            document.getElementById('cropContainer').classList.add('hidden');
            document.getElementById('croppedResultContainer').classList.remove('hidden');
            destroyCropper();
        }

        function reselectImage() {
            destroyCropper();
            document.getElementById('cropContainer').classList.add('hidden');
            document.getElementById('croppedResultContainer').classList.add('hidden');
            document.getElementById('dropZone').classList.remove('hidden');
            document.getElementById('imageInput').value = "";
            currentImageBase64 = "";
        }

        function destroyCropper() {
            if (cropper) {
                cropper.destroy();
                cropper = null;
            }
        }

        /* ================= 语音录制逻辑修复 ================= */
        async function toggleRecording() {
            const statusText = document.getElementById('recordStatus');
            const recordIcon = document.getElementById('recordIcon');
            const playback = document.getElementById('audioPlayback');
            const timerEl = document.getElementById('recordTimer');

            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    
                    let options = {};
                    if (MediaRecorder.isTypeSupported('audio/webm')) options = { mimeType: 'audio/webm' };
                    else if (MediaRecorder.isTypeSupported('audio/mp4')) options = { mimeType: 'audio/mp4' };

                    mediaRecorder = new MediaRecorder(stream, options);
                    audioChunks = [];
                    
                    mediaRecorder.ondataavailable = event => {
                        if (event.data.size > 0) audioChunks.push(event.data);
                    };

                    mediaRecorder.onstop = async () => {
                        audioBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
                        audioBase64 = await blobToBase64(audioBlob);
                        playback.src = audioBase64;
                        playback.classList.remove('hidden');
                        statusText.innerText = "录音完成，可播放试听";
                    };

                    mediaRecorder.start(100);
                    isRecording = true;
                    recordIcon.classList.remove('bg-red-600');
                    recordIcon.classList.add('bg-textMain', 'animate-pulse');
                    statusText.innerText = "正在录音...";
                    
                    timerEl.innerText = "00:00";
                    timerEl.classList.remove('hidden');
                    recordStartTime = Date.now();
                    recordTimerInterval = setInterval(() => {
                        const seconds = Math.floor((Date.now() - recordStartTime) / 1000);
                        const m = String(Math.floor(seconds / 60)).padStart(2, '0');
                        const s = String(seconds % 60).padStart(2, '0');
                        timerEl.innerText = `${m}:${s}`;
                    }, 1000);

                } catch (err) {
                    console.error("Microphone access failed:", err);
                    statusText.innerText = "无法获取麦克风权限。";
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                clearInterval(recordTimerInterval);
                recordIcon.classList.remove('bg-textMain', 'animate-pulse');
                recordIcon.classList.add('bg-red-600');
                if (mediaRecorder.stream) {
                    mediaRecorder.stream.getTracks().forEach(track => track.stop());
                }
            }
        }

        function blobToBase64(blob) {
            return new Promise((resolve) => {
                if (!blob) return resolve(null);
                const reader = new FileReader();
                reader.onloadend = () => resolve(reader.result);
                reader.readAsDataURL(blob);
            });
        }

        async function saveArchive(event) {
            event.preventDefault();
            if (!currentImageBase64) {
                alert("请选择并确认一张视觉参考图片。");
                return;
            }

            const editId = document.getElementById('editingId').value;
            const tx = db.transaction([STORE_NAME], "readwrite");
            const store = tx.objectStore(STORE_NAME);

            if (editId) {
                const req = store.get(Number(editId));
                req.onsuccess = () => {
                    const data = req.result;
                    data.title = document.getElementById('itemTitle').value.trim();
                    data.tag = document.getElementById('itemTag').value;
                    data.link = document.getElementById('itemLink').value.trim();
                    data.desc = document.getElementById('itemDesc').value.trim();
                    data.image = currentImageBase64;
                    if (audioBase64) data.audio = audioBase64;
                    
                    store.put(data).onsuccess = () => {
                        closeModal();
                        loadArchives();
                    };
                };
            } else {
                const record = {
                    title: document.getElementById('itemTitle').value.trim(),
                    tag: document.getElementById('itemTag').value,
                    link: document.getElementById('itemLink').value.trim(),
                    desc: document.getElementById('itemDesc').value.trim(),
                    image: currentImageBase64,
                    audio: audioBase64,
                    createdAt: new Date().toLocaleDateString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit' })
                };
                store.add(record).onsuccess = () => {
                    closeModal();
                    loadArchives();
                };
            }
        }

        /* ================= 筛选与分类切换 ================= */
        function filterTag(tag) {
            currentFilter = tag;
            document.querySelectorAll('.tag-btn').forEach(btn => {
                btn.className = "tag-btn text-textMuted hover:text-textMain pb-1 border-b border-transparent transition-all shrink-0";
            });
            const activeBtn = document.getElementById(`tag-${tag}`);
            if (activeBtn) {
                activeBtn.className = "tag-btn text-textMain font-medium pb-1 border-b border-textMain transition-all shrink-0";
            }

            const resolveSubNav = document.getElementById('resolveSubNav');
            const resolvePanel = document.getElementById('resolvePanel');

            if (tag === '定力') {
                resolveSubNav.classList.remove('hidden');
                resolvePanel.classList.remove('hidden');
                loadResolveRecords();
            } else {
                resolveSubNav.classList.add('hidden');
                resolvePanel.classList.add('hidden');
                loadArchives();
            }
        }

        function switchResolveSub(subType) {
            currentResolveSub = subType;
            document.querySelectorAll('.resolve-sub-btn').forEach(btn => {
                btn.className = "resolve-sub-btn text-textMuted hover:text-textMain pb-1 border-b border-transparent transition-all";
            });
            const activeBtn = document.getElementById(`resolve-sub-${subType}`);
            if (activeBtn) {
                activeBtn.className = "resolve-sub-btn text-textMain font-medium pb-1 border-b border-textMain transition-all";
            }
            loadResolveRecords();
        }

        function loadArchives() {
            if (!db) return;
            const tx = db.transaction([STORE_NAME], "readonly");
            tx.objectStore(STORE_NAME).getAll().onsuccess = (event) => {
                const items = event.target.result;
                let filtered = currentFilter === 'all' ? items : items.filter(i => i.tag === currentFilter);
                document.getElementById('recordCount').innerText = `收录：${filtered.length}`;
                renderArchivesGrid(filtered, false);
            };
        }

        function loadResolveRecords() {
            if (!db) return;
            const tx = db.transaction([RESOLVE_RECORDS_STORE], "readonly");
            tx.objectStore(RESOLVE_RECORDS_STORE).getAll().onsuccess = (event) => {
                const items = event.target.result;
                const filtered = items.filter(i => i.subType === currentResolveSub);
                document.getElementById('recordCount').innerText = `记录：${filtered.length}`;
                renderArchivesGrid(filtered, true);
            };
        }

        function editArchive(id) {
            const tx = db.transaction([STORE_NAME], "readonly");
            tx.objectStore(STORE_NAME).get(id).onsuccess = (e) => {
                const item = e.target.result;
                if (item) openModal(item);
            };
        }

        function editResolveRecord(id) {
            const tx = db.transaction([RESOLVE_RECORDS_STORE], "readonly");
            tx.objectStore(RESOLVE_RECORDS_STORE).get(id).onsuccess = (e) => {
                const item = e.target.result;
                if (item) openResolveModal(item);
            };
        }

        function renderArchivesGrid(items, isResolveMode) {
            const grid = document.getElementById('archiveGrid');
            const emptyState = document.getElementById('emptyState');
            const emptyText = document.getElementById('emptyText');

            if (items.length === 0) {
                grid.innerHTML = '';
                if (isResolveMode) {
                    emptyText.innerText = currentResolveSub === 'train' ? "“记录你想专注训练的事，无需打卡，从容积累。”" : "“倾听字句之间的呼吸，记录打动你的那些句子。”";
                } else {
                    emptyText.innerText = "“暂无灵感收录，开启你的美学建构吧。”";
                }
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            grid.innerHTML = '';
            const sorted = [...items].sort((a, b) => b.id - a.id);

            sorted.forEach(item => {
                const card = document.createElement('div');
                card.className = "group flex flex-col space-y-3 md:space-y-4 border-b border-borderSubtle/60 pb-6 sm:border-none sm:pb-0";

                if (isResolveMode) {
                    if (item.subType === 'quote') {
                        card.innerHTML = `
                            <div class="bg-stoneLight/40 p-6 md:p-7 flex flex-col justify-between relative min-h-[150px] border border-borderSubtle hover:border-textMain/30 transition-all">
                                <div class="absolute top-3 right-3 flex items-center gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                                    <button onclick="editResolveRecord(${item.id})" class="text-[11px] text-textMuted hover:text-textMain uppercase tracking-wider">编辑</button>
                                    <button onclick="deleteResolveRecord(${item.id})" class="text-textMuted hover:text-red-600 text-xs w-5 h-5 flex items-center justify-center" title="删除">&times;</button>
                                </div>
                                <div>
                                    <span class="text-[9px] uppercase tracking-[0.25em] text-textMuted font-light block mb-3">Quote · 句子</span>
                                    <blockquote class="font-serif text-sm md:text-base font-light text-textMain tracking-wide leading-relaxed mb-3">
                                        “${escapeHtml(item.title)}”
                                    </blockquote>
                                    ${item.content ? `<p class="font-serif text-xs text-textMuted font-light leading-relaxed tracking-wide italic border-l border-borderSubtle pl-3 my-2">${escapeHtml(item.content)}</p>` : ''}
                                </div>
                                <span class="text-[9px] text-textMuted font-light tracking-wider pt-3 block">${item.createdAt}</span>
                            </div>
                        `;
                    } else {
                        card.innerHTML = `
                            <div class="bg-stoneLight/40 p-6 flex flex-col justify-between relative min-h-[150px] border border-borderSubtle hover:border-textMain/30 transition-all">
                                <div class="absolute top-3 right-3 flex items-center gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                                    <button onclick="editResolveRecord(${item.id})" class="text-[11px] text-textMuted hover:text-textMain uppercase tracking-wider">编辑</button>
                                    <button onclick="deleteResolveRecord(${item.id})" class="text-textMuted hover:text-red-600 text-xs w-5 h-5 flex items-center justify-center" title="删除">&times;</button>
                                </div>
                                <div>
                                    <span class="text-[9px] uppercase tracking-[0.25em] text-textMuted font-light block mb-2">Practice · 想训练的事</span>
                                    <h3 class="font-serif text-sm md:text-base font-light tracking-wide text-textMain mb-2">${escapeHtml(item.title)}</h3>
                                    ${item.content ? `<p class="text-xs text-textMuted font-light leading-relaxed whitespace-pre-wrap tracking-wide">${escapeHtml(item.content)}</p>` : ''}
                                </div>
                                <span class="text-[9px] text-textMuted font-light tracking-wider pt-3 block">${item.createdAt}</span>
                            </div>
                        `;
                    }
                } else {
                    let audioHtml = item.audio ? `<div class="mt-3 pt-3 border-t border-borderSubtle"><audio controls src="${item.audio}" class="w-full h-8 opacity-80"></audio></div>` : '';
                    let linkHtml = item.link ? `<div class="pt-2"><a href="${escapeHtml(item.link)}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1.5 text-xs text-textMain hover:text-textMuted tracking-wider font-light border-b border-textMain pb-0.5 transition-all"><span>访问网页源</span><span class="text-[10px]">&nearr;</span></a></div>` : '';

                    card.innerHTML = `
                        <div class="overflow-hidden bg-stoneLight relative w-full border border-borderSubtle/50 flex items-center justify-center">
                            <img src="${item.image}" alt="${escapeHtml(item.title)}" class="w-full h-auto block object-contain group-hover:scale-[1.02] transition-transform duration-700 ease-out">
                            <span class="absolute top-3 left-3 bg-cream/90 backdrop-blur-md text-textMain text-[10px] uppercase tracking-widest px-2.5 py-1 font-light border border-borderSubtle/40">${item.tag}</span>
                            <div class="absolute top-3 right-3 flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                                <button onclick="editArchive(${item.id})" class="bg-cream/90 backdrop-blur-md text-textMain hover:bg-textMain hover:text-cream text-[10px] uppercase tracking-wider px-2 py-1 transition-colors border border-borderSubtle/40">编辑</button>
                                <button onclick="deleteArchive(${item.id})" class="bg-cream/90 backdrop-blur-md text-textMuted hover:text-red-600 text-xs w-6 h-6 flex items-center justify-center transition-colors border border-borderSubtle/40" title="删除切片">&times;</button>
                            </div>
                        </div>
                        <div class="space-y-2 pt-1">
                            <div class="flex justify-between items-baseline gap-3">
                                <h3 class="font-serif text-base md:text-lg font-light tracking-wide text-textMain">${escapeHtml(item.title)}</h3>
                                <span class="text-[10px] text-textMuted font-light shrink-0">${item.createdAt}</span>
                            </div>
                            ${item.desc ? `<p class="text-xs text-textMuted font-light leading-relaxed">${escapeHtml(item.desc)}</p>` : ''}
                            ${linkHtml}
                            ${audioHtml}
                        </div>
                    `;
                }
                grid.appendChild(card);
            });
        }

        function deleteArchive(id) {
            if (!confirm('确认删除这条灵感切片吗？')) return;
            const tx = db.transaction([STORE_NAME], "readwrite");
            tx.objectStore(STORE_NAME).delete(id).onsuccess = () => loadArchives();
        }

        function deleteResolveRecord(id) {
            if (!confirm('确认删除这条记录吗？')) return;
            const tx = db.transaction([RESOLVE_RECORDS_STORE], "readwrite");
            tx.objectStore(RESOLVE_RECORDS_STORE).delete(id).onsuccess = () => loadResolveRecords();
        }

        function loadContent() {
            if (currentFilter === '定力') {
                loadResolveRecords();
            } else {
                loadArchives();
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        window.onload = function() {
            initDB();
            bindResolveEditable();
        };
    </script>
</body>
</html>
